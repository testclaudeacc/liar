import io.github.fourlastor.construo.Target

buildscript {
    repositories { mavenCentral() }
    // ProGuard: embaralha o codigo do jogo dentro do .jar/.exe/Linux (igual o R8 no APK).
    dependencies { classpath 'com.guardsquare:proguard-gradle:7.10.0' }
}

plugins {
    // Construo: gera Linux e Windows com um Java enxuto (jlink) embutido -
    // o jogador nao precisa instalar Java. Tasks: packageLinuxX64, packageWinX64.
    id 'io.github.fourlastor.construo' version '2.2.3'
}

apply plugin: 'java-library'
apply plugin: 'application'

mainClassName = 'com.teste.desktop.DesktopLauncher'
sourceCompatibility = 17
targetCompatibility = 17

sourceSets.main.resources.srcDirs += [ "../core/assets" ]

// Versao do jogo = CLIENT_VERSION do ServerConfig.java ("v0.50" -> "0.50"):
// um lugar so' pra subir a versao (CLAUDE.md), o export segue sozinho.
def textoConfig = file("../core/src/main/java/com/teste/game/rede/ServerConfig.java").text
def versaoJogo = (textoConfig =~ /CLIENT_VERSION\s*=\s*"v?([0-9.]+)"/)[0][1]
version = versaoJogo  // o Construo usa a versao do projeto

configurations {
    // gdx-tools (TexturePacker) so' pra task "pack" - nao entra no jogo exportado.
    ferramentas
}

dependencies {
    implementation project(':core')
    api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    ferramentas "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
}

run {
    workingDir = file("../core/assets")
    standardInput = System.in
}

// Jar "gordo" (jogo + bibliotecas + assets) que o Construo empacota.
jar {
    archiveBaseName.set('MiteraOnline')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/maven/**')
    // So' Linux/Windows x64 sao exportados: tira as bibliotecas nativas de Mac e ARM (jar menor).
    exclude('**/*.dylib', 'macos/**', 'linux/arm32/**', 'linux/arm64/**', 'windows/arm64/**', 'windows/x86/**',
            'libgdxarm*.so', 'libgdx-freetypearm*.so')
    manifest {
        attributes 'Main-Class': 'com.teste.desktop.DesktopGameLauncher'
    }
}

construo {
    name.set('MiteraOnline')
    humanName.set('Mitera Online')
    mainClass.set('com.teste.desktop.DesktopGameLauncher')
    outputDir.set(rootProject.file('dist'))
    jarTask.set('jarOfuscado')  // o jar ja' embaralhado pelo ProGuard (ver abaixo)
    jlink {
        // Java so' com os modulos que o jogo usa (bem menor que o JRE inteiro);
        // cripto incluida pra HTTPS/WSS funcionar com o dominio.
        guessModulesFromJar.set(true)
        includeDefaultCryptoModules.set(true)
    }
    targets {
        create('linuxX64', Target.Linux) {
            architecture.set(Target.Architecture.X86_64)
            jdkUrl.set('https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.13%2B11/OpenJDK17U-jdk_x64_linux_hotspot_17.0.13_11.tar.gz')
        }
        create('winX64', Target.Windows) {
            architecture.set(Target.Architecture.X86_64)
            jdkUrl.set('https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.13%2B11/OpenJDK17U-jdk_x64_windows_hotspot_17.0.13_11.zip')
            useGpuHint.set(false)
        }
    }
}

// ---------------------------------------------------------------------------
// EMBARALHAR (ProGuard): so' o codigo do jogo (com.teste.**) e' renomeado; libGDX,
// LWJGL, WebSocket e os assets passam intactos. jar -> proguard -> jarOfuscado.
// ---------------------------------------------------------------------------

// Classes do proprio Java (pro ProGuard saber o que e' do Java e nao renomear,
// ex: run() de Runnable). Tirado do JDK que esta' rodando o Gradle (jrt:/),
// funciona com qualquer JDK 17+ (sem precisar da pasta jmods).
tasks.register('classesDoJava') {
    def saida = layout.buildDirectory.file('proguard/java-classes.jar')
    outputs.file(saida)
    doLast {
        def fs = java.nio.file.FileSystems.getFileSystem(URI.create('jrt:/'))
        def arquivo = saida.get().asFile
        arquivo.parentFile.mkdirs()
        new java.util.zip.ZipOutputStream(new FileOutputStream(arquivo)).withCloseable { zip ->
            ['java.base', 'java.desktop', 'java.logging', 'java.xml', 'jdk.unsupported'].each { modulo ->
                def raiz = fs.getPath('modules', modulo)
                java.nio.file.Files.walk(raiz).withCloseable { arquivos ->
                    arquivos.filter { it.toString().endsWith('.class') && it.fileName.toString() != 'module-info.class' }
                        .forEach { c ->
                            zip.putNextEntry(new java.util.zip.ZipEntry(raiz.relativize(c).toString()))
                            zip.write(java.nio.file.Files.readAllBytes(c))
                            zip.closeEntry()
                        }
                }
            }
        }
    }
}

tasks.register('proguard', proguard.gradle.ProGuardTask) {
    dependsOn jar, 'classesDoJava'
    injars jar.archiveFile
    outjars layout.buildDirectory.file('proguard/MiteraOnline-proguard.jar')
    libraryjars layout.buildDirectory.file('proguard/java-classes.jar')
    configuration file('proguard-rules.pro')
}

// Jar final (o que o Construo poe no .exe e no Linux), com o manifest certo.
tasks.register('jarOfuscado', Jar) {
    dependsOn 'proguard'
    archiveBaseName.set('MiteraOnline')
    archiveClassifier.set('ofuscado')
    from { zipTree(layout.buildDirectory.file('proguard/MiteraOnline-proguard.jar')) }
    manifest {
        attributes 'Main-Class': 'com.teste.desktop.DesktopGameLauncher'
    }
}

// Empacota core/assets-raw/graphics/**/*.png num unico atlas em core/assets/graphics/
// (ver comentario original: nome da regiao = caminho relativo sem extensao).
tasks.register('pack', JavaExec) {
    group = 'build'
    description = 'Reempacota core/assets-raw/graphics/ em core/assets/graphics/graphics.atlas'
    classpath = sourceSets.main.runtimeClasspath + configurations.ferramentas
    mainClass = 'com.badlogic.gdx.tools.texturepacker.TexturePacker'
    args = [
        "${projectDir}/../core/assets-raw/graphics",
        "${projectDir}/../core/assets/graphics",
        "graphics"
    ]
}

tasks.register('runMapa', JavaExec) {
    group = 'application'
    description = 'Roda o visualizador do mapa real (World.tmx)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.teste.desktop.DesktopMapaLauncher'
    workingDir = file("../core/assets")
    standardInput = System.in
}

tasks.register('runGame', JavaExec) {
    group = 'application'
    description = 'Roda o cliente de verdade (login + rede contra o servidor Python)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.teste.desktop.DesktopGameLauncher'
    workingDir = file("../core/assets")
    standardInput = System.in
}
